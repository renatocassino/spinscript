<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SpinScript WASM</title>
  <style>
    .editor {
      position: relative;
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
    }

    .editor pre,
    .editor textarea {
      margin: 0;
      padding: 0.5rem;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow: auto;
      border: none;
    }

    #highlight {
      color: #1f2328;
      background: #fff;
      pointer-events: none;
    }

    #spincode {
      resize: none;
      background: transparent;
      color: transparent;
      caret-color: #1f2328;
    }

    .tok-comment { color: #6a737d; font-style: italic; }
    .tok-string { color: #22863a; }
    .tok-number { color: #005cc5; }
    .tok-keyword { color: #d73a49; font-weight: bold; }
    .tok-variable { color: #6f42c1; }
    .tok-parameter { color: #e36209; }
  </style>
</head>
<body>
  <section style="display: flex; flex-direction: column; gap: 1rem; width: 100%; height: 100%;">
    <h1>SpinScript WASM</h1>
    <p>Type your SpinScript code below:</p>
    <div class="editor">
      <pre id="highlight" aria-hidden="true"><code id="highlight-code"></code></pre>
      <textarea id="spincode" spellcheck="false"></textarea>
    </div>
    <input readonly id="error" style="color: red;">
    <button id="play">Play</button>
  </section>
  <script type="module" src="./main.js"></script>
  <script type="module">
    await window.SpinScriptReady;
    console.log(SpinScript.Parse("@bpm = 120;"));
  </script>
</body>
</html>
