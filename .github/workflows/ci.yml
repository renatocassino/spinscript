name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core + CLI + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build SpinScript
      - run: dotnet test SpinScript.Tests

  web:
    name: WASM + playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install wasm-tools
      # sync-wasm copia a saída Debug de SpinScript.Wasm para public/wasm
      - run: dotnet build SpinScript.Wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spinscript-web/package-lock.json
      - run: npm ci
        working-directory: spinscript-web
      - run: npm run build
        working-directory: spinscript-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spinscript-web/dist

  # Mesmo esquema de play.cassino.dev / games.cassino.dev: GitHub Pages,
  # sem token — o domínio vem de spinscript-web/public/CNAME.
  deploy:
    name: Deploy (GitHub Pages)
    needs: [test, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  vscode:
    name: Extensão VS Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spinscript-vscode/package-lock.json
      - run: npm ci
        working-directory: spinscript-vscode
      - run: npm run compile
        working-directory: spinscript-vscode
