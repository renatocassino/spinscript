name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core + CLI + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build SpinScript
      - run: dotnet test SpinScript.Tests

  # Roda o mesmo script que o Workers Builds da Cloudflare usa pra publicar
  # (scripts/cloudflare-build.sh): se quebrar aqui, quebraria no deploy.
  # O deploy em si é feito pela Cloudflare, não por este workflow.
  web:
    name: WASM (Release) + playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spinscript-web/package-lock.json
      - run: bash scripts/cloudflare-build.sh

  vscode:
    name: Extensão VS Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spinscript-vscode/package-lock.json
      - run: npm ci
        working-directory: spinscript-vscode
      - run: npm run compile
        working-directory: spinscript-vscode
